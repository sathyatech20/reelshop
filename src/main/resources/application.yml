spring:
  application:
    name: reelshop-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reelshop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

  # ── Multipart file upload config ──────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: always

# JWT Config
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-your-generated-base64-key}
    expiration-ms: 2592000000

  # OTP Config
  otp:
    expiry-seconds: 300
    length: 6
    max-attempts: 3

  # MSG91 Config
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
    template-id: ${MSG91_TEMPLATE_ID:}
    sender-id: RELSHP

  # Cloudinary Config
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  # Base URL for QR codes
  base-url: ${BASE_URL:http://localhost:5173}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.reelshop: DEBUG
    org.springframework.security: INFO
